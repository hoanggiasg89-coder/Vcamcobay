name: Build Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install RootHide Theos and iOS SDK
        run: |
          scripts/install-theos-environment.sh --skip-build-test
          echo "THEOS=$HOME/theos-roothide" >> "$GITHUB_ENV"

      - name: Build and validate package
        run: scripts/test-build.sh
