name: Build Check

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Theos environment
        run: |
          git clone --recursive https://github.com/theos/theos.git C:\Users\hoang/theos
          echo "export THEOS=C:\Users\hoang/theos" >> 
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build Tweak
        run: |
          make package
